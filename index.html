<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fishing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#76bfe1;font-family:Arial,Helvetica,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.money{position:absolute;right:18px;top:16px;background:rgba(10,18,30,.78);border-radius:13px;padding:10px 15px;font-weight:800;font-size:18px}
.smallBtn{pointer-events:auto;border:0;border-radius:11px;padding:10px 14px;background:rgba(12,20,31,.82);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#settingsBtn{position:absolute;left:16px;top:16px}
#rodBtn{position:absolute;right:16px;bottom:18px}
#message{position:absolute;left:50%;top:15%;transform:translateX(-50%);padding:12px 20px;border-radius:13px;background:rgba(8,13,22,.84);font-size:22px;font-weight:800;text-align:center;opacity:0;transition:opacity .18s;white-space:nowrap}
#joystick{position:absolute;left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(15,24,37,.34);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#stick{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 3px 10px rgba(0,0,0,.25)}
#tapHint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 13px;background:rgba(8,13,22,.58);border-radius:10px;font-size:13px;font-weight:700}
.panelShade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.panel{width:min(880px,94vw);max-height:88vh;overflow:auto;background:rgba(18,25,37,.97);border-radius:22px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.panel h1{margin:0 0 16px;text-align:center;font-size:34px}
.rodRow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:rgba(29,39,54,.8);padding:14px 16px;border-radius:14px;margin:10px 0}
.rodName{font-size:23px;font-weight:900}
.rodOdds{font-size:14px;color:#ddd;margin-top:5px}
.price{font-size:21px;font-weight:900;color:#ffe067;white-space:nowrap}
.buy{border:0;border-radius:9px;background:#2db953;color:#fff;font-size:18px;font-weight:900;padding:9px 22px;min-width:86px}
.close{display:block;margin:16px auto 0;border:0;border-radius:10px;background:#d73535;color:#fff;font-size:18px;font-weight:900;padding:10px 30px}
.menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(35,103,139,.35),rgba(4,26,45,.72));}
.menuCard{width:min(430px,88vw);background:rgba(12,19,30,.9);border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.35);text-align:center}
.menuCard h1{font-size:54px;margin:4px 0 8px}
.menuCard p{margin:0 0 22px;color:#c8d7e5}
.menuBtn{width:100%;border:0;border-radius:13px;padding:14px;margin:6px 0;background:#2eaf52;color:#fff;font-size:20px;font-weight:900}
.menuBtn.secondary{background:#344457}
#toast{position:fixed;left:50%;bottom:17%;transform:translateX(-50%);z-index:50;background:rgba(7,12,20,.9);padding:12px 18px;border-radius:12px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}
#mini{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.miniBox{width:min(500px,90vw);text-align:center}
.wait{display:inline-block;background:rgba(8,13,22,.84);border-radius:12px;padding:10px 20px;font-size:24px;font-weight:900;margin-bottom:18px}
.track{height:360px;width:78px;margin:auto;background:rgba(30,36,44,.86);border:4px solid rgba(255,255,255,.78);border-radius:22px;position:relative;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.safe{position:absolute;left:0;right:0;height:84px;top:138px;background:rgba(49,205,84,.78);border-top:2px solid #fff;border-bottom:2px solid #fff}
.cursor{position:absolute;left:7px;right:7px;height:20px;background:#ff8c17;border-radius:8px;top:0;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.miniText{margin-top:14px;font-weight:900;background:rgba(8,13,22,.7);display:inline-block;padding:8px 12px;border-radius:9px}
@media(max-width:600px){
 .money{font-size:16px}.rodRow{grid-template-columns:1fr auto}.rodOdds{grid-column:1/-1}.buy{grid-column:2;grid-row:1}.price{font-size:18px}
 .panel h1{font-size:28px}.rodName{font-size:18px}.track{height:300px}.safe{top:108px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" hidden>
  <div class="money" id="money">0</div>
  <button class="smallBtn" id="settingsBtn">⚙ Settings</button>
  <button class="smallBtn" id="rodBtn">🪝 Rods</button>
  <div id="message"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="tapHint">Tap a raised fishing spot to cast</div>
</div>

<div id="rodPanel" class="panelShade">
 <div class="panel">
  <h1>Rod Shop</h1>
  <div id="rodList"></div>
  <button class="close" id="closeRods">Close</button>
 </div>
</div>

<div id="settingsPanel" class="panelShade">
 <div class="panel">
  <h1>Settings</h1>
  <div style="display:grid;gap:14px">
   <label style="background:rgba(29,39,54,.8);padding:15px;border-radius:13px;font-weight:800">
    Day / Night
    <select id="timeMode" style="float:right;padding:7px;border-radius:8px">
      <option value="day">Day</option><option value="night">Night</option>
    </select>
   </label>
   <label style="background:rgba(29,39,54,.8);padding:15px;border-radius:13px;font-weight:800">
    Player color
    <input id="playerColor" type="color" value="#ff4f72" style="float:right;width:54px;height:32px">
   </label>
  </div>
  <button class="close" id="closeSettings">Close</button>
 </div>
</div>

<div id="mini">
 <div class="miniBox">
   <div class="wait" id="waitText">Balık bekleniyor...</div>
   <div class="track"><div class="safe"></div><div class="cursor" id="cursor"></div></div>
   <div class="miniText">Tap while the orange cursor is inside the green area</div>
 </div>
</div>

<div id="toast"></div>

<div id="menu" class="menu">
 <div class="menuCard">
   <h1>🎣 Fishing</h1>
   <p>Fish → buy rods → collect rarer catches.</p>
   <button class="menuBtn" id="playBtn">Play</button>
   <button class="menuBtn secondary" id="coopBtn">Co-op</button>
   <button class="menuBtn secondary" id="menuSettings">Settings</button>
 </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x82c8e6);
scene.fog = new THREE.Fog(0x82c8e6, 55, 145);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 400);
camera.position.set(15,16,19);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
game.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xbdeaff,0x284f37,2.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-25,35,15); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-55; sun.shadow.camera.right=55; sun.shadow.camera.top=55; sun.shadow.camera.bottom=-55;
scene.add(sun);

const waterMat = new THREE.MeshStandardMaterial({color:0x1688b9,roughness:.2,metalness:.05});
const water = new THREE.Mesh(new THREE.PlaneGeometry(280,280),waterMat);
water.rotation.x=-Math.PI/2; water.position.y=-1.5; water.receiveShadow=true; scene.add(water);

const islandGroup = new THREE.Group(); scene.add(islandGroup);
const grassMat = new THREE.MeshStandardMaterial({color:0x79a94a,roughness:1});
const dirtMat = new THREE.MeshStandardMaterial({color:0x556d3e,roughness:1});
const pathMat = new THREE.MeshStandardMaterial({color:0xd9dce0,roughness:.95});

function makeIsland(){
  const base = new THREE.Mesh(new THREE.CylinderGeometry(9.7,8.6,2.2,14),dirtMat);
  base.position.y=-.3; base.scale.z=.86; base.castShadow=true; base.receiveShadow=true; islandGroup.add(base);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(9.25,8.2,.65,14),grassMat);
  top.position.y=.95; top.scale.z=.86; top.receiveShadow=true; islandGroup.add(top);

  const path = new THREE.Mesh(new THREE.PlaneGeometry(4.1,11),pathMat);
  path.rotation.x=-Math.PI/2; path.position.set(-1.3,1.31,.2); path.rotation.z=-.18; path.receiveShadow=true; islandGroup.add(path);

  // scattered grass clumps
  const bladeMat = new THREE.MeshStandardMaterial({color:0x9bc75a,side:THREE.DoubleSide});
  for(let i=0;i<85;i++){
    const a=Math.random()*Math.PI*2, r=2.8+Math.random()*5.7;
    const x=Math.cos(a)*r, z=Math.sin(a)*r*.84;
    if(Math.abs(x+1.3)<2.0 && Math.abs(z)<5.0) continue;
    const h=.35+Math.random()*.55;
    const g=new THREE.Mesh(new THREE.ConeGeometry(.045,.55+h,4),bladeMat);
    g.position.set(x,.1+h/2,z); g.rotation.y=Math.random()*Math.PI; g.castShadow=true; islandGroup.add(g);
  }
}
makeIsland();

function lamp(x,z,rot=0){
 const g=new THREE.Group();
 const post=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,2.4,8),new THREE.MeshStandardMaterial({color:0x162230,roughness:.65}));
 post.position.y=2.4; post.castShadow=true; g.add(post);
 const cap=new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.38),new THREE.MeshStandardMaterial({color:0x101923,roughness:.5}));
 cap.position.y=3.65; g.add(cap);
 const light=new THREE.Mesh(new THREE.BoxGeometry(.28,.34,.23),new THREE.MeshStandardMaterial({color:0xffffe0,emissive:0xfff4bd,emissiveIntensity:.8}));
 light.position.y=3.43; g.add(light);
 g.position.set(x,1,z); g.rotation.y=rot; islandGroup.add(g);
}
[[-7,-4],[-5,1],[-3,5],[1,3],[5,0],[6,-5],[2,-6],[-7,4]].forEach(p=>lamp(p[0],p[1]));

function dock(){
 const wood=new THREE.MeshStandardMaterial({color:0x765044,roughness:.8});
 const dark=new THREE.MeshStandardMaterial({color:0x3d302c,roughness:.9});
 const group=new THREE.Group();
 for(let i=0;i<10;i++){
  const plank=new THREE.Mesh(new THREE.BoxGeometry(2.8,.28,1.0),wood);
  plank.position.set(i*.95-2,1.05,-10.3); plank.castShadow=true; group.add(plank);
 }
 for(let i=0;i<4;i++){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,3.0,.18),dark);
  leg.position.set(i*2.8-1.5,-.2,-10.3); leg.castShadow=true; group.add(leg);
 }
 const side=new THREE.Mesh(new THREE.BoxGeometry(10,.25,.18),dark); side.position.set(2.4,1.45,-10.85); group.add(side);
 for(let i=0;i<5;i++){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(.14,1.1,.14),dark);
  rail.position.set(i*2.1-1.5,1.55,-9.55); group.add(rail);
 }
 scene.add(group);
}
dock();

function ripple(x,z,scale=1){
 const ring=new THREE.Mesh(new THREE.RingGeometry(1.0,1.18,40),new THREE.MeshBasicMaterial({color:0xe9f8ff,transparent:true,opacity:.75,side:THREE.DoubleSide}));
 ring.rotation.x=-Math.PI/2; ring.position.set(x,-1.42,z); ring.scale.set(scale,scale,scale);
 scene.add(ring);
 return ring;
}
const spots=[
 {pos:new THREE.Vector3(-10,0,-1),scale:1.25},
 {pos:new THREE.Vector3(-7,0,6),scale:1.05},
 {pos:new THREE.Vector3(7,0,6),scale:1.35},
 {pos:new THREE.Vector3(11,0,-2),scale:1.15},
 {pos:new THREE.Vector3(6,0,-8),scale:1.0}
];
spots.forEach(s=>{s.ring=ripple(s.pos.x,s.pos.z,s.scale)});

function makePlayer(){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:0xff4f72,roughness:.7});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,5,10),bodyMat);
 body.position.y=2.0; body.castShadow=true; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),new THREE.MeshStandardMaterial({color:0xf1c7a7,roughness:.8}));
 head.position.y=2.95; head.castShadow=true; g.add(head);
 const hat=new THREE.Mesh(new THREE.ConeGeometry(.55,.34,12),new THREE.MeshStandardMaterial({color:0xf2e5b8,roughness:.8}));
 hat.position.y=3.55; hat.rotation.y=.2; hat.castShadow=true; g.add(hat);
 const legMat=new THREE.MeshStandardMaterial({color:0x202532});
 for(const x of [-.23,.23]){
   const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.7,8),legMat);
   leg.position.set(x,1.05,0); leg.castShadow=true; g.add(leg);
 }
 g.position.set(0,0,3);
 scene.add(g);
 return {group:g,bodyMat};
}
const player=makePlayer();

const rods=[
 {name:"Starter Rod",price:0,odds:[70,27,3],color:0x9b5b22},
 {name:"Better Rod",price:100000,odds:[65,25,10],color:0xf0f0f0},
 {name:"Electric Rod",price:500000,odds:[55,30,15],color:0xf3d51d},
 {name:"Grass Rod",price:1000000,odds:[50,30,20],color:0x55b94b},
 {name:"Astral Rod",price:1000000000,odds:[30,35,45],color:0x9b59ff}
];
let money=250;
let currentRod=0;

const fish=[
 ["Shrimp","Normal"],["Anchovy","Normal"],["Atlantic Silverside","Normal"],["Bass","Normal"],["Blue Crab","Normal"],["Blue Mackerel","Normal"],["Mullet","Normal"],["Salmon","Normal"],["Sardine","Normal"],["Sea Bream","Normal"],["Sole","Normal"],["Starfish","Normal"],["Tune","Normal"],["Whiting","Normal"],["Cod","Normal"],["Krill","Normal"],
 ["Lobster","Rare"],["Moon Jellyfish","Rare"],["Parrotfish","Rare"],["Purple Octopus","Rare"],["Caretta Caretta","Rare"],["Cauliflower Jellyfish","Rare"],["Clownfish","Rare"],["Eel","Rare"],["Lionfish","Rare"],["Mola Mola","Rare"],["Seahorse","Rare"],["Stingray","Rare"],
 ["Dragon Moray Eel","Legendary"],["Kraken","Legendary"],["Great Whale","Legendary"],["Nautilus","Legendary"],["Whale Shark","Legendary"],["İsonade","Legendary"]
];
const fishPrices={Normal:250,Rare:1250,Legendary:6250};

function format(n){return n.toLocaleString("en-US")}
function updateMoney(){document.getElementById("money").textContent="💰 "+format(money)}
updateMoney();

function toast(t,ms=1800){
 const el=document.getElementById("toast"); el.textContent=t; el.style.opacity=1;
 clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.opacity=0,ms);
}
function message(t,ms=1800){
 const el=document.getElementById("message"); el.textContent=t; el.style.opacity=1;
 clearTimeout(message.t); message.t=setTimeout(()=>el.style.opacity=0,ms);
}

function renderRods(){
 const list=document.getElementById("rodList"); list.innerHTML="";
 rods.slice(1).forEach((r,i)=>{
  const idx=i+1, row=document.createElement("div"); row.className="rodRow";
  const odds=r.odds;
  row.innerHTML=`<div><div class="rodName" style="color:#${r.color.toString(16).padStart(6,"0")}">${r.name}</div><div class="rodOdds"><span style="color:#56c85a">Normal: ${odds[0]}%</span> &nbsp;<span style="color:#ffd43b">Rare: ${odds[1]}%</span> &nbsp;<span style="color:#ef4b4b">Legendary: ${odds[2]}%</span></div></div><div class="price">${format(r.price)}</div><button class="buy">${currentRod===idx?"Equipped":money>=r.price?"Buy":"Buy"}</button>`;
  const btn=row.querySelector(".buy");
  btn.disabled=currentRod===idx;
  if(btn.disabled){btn.style.background="#59636f"} 
  btn.addEventListener("click",()=>{
    if(money>=r.price){money-=r.price;currentRod=idx;updateMoney();renderRods();toast(r.name+" equipped!");}
    else toast("Not enough money.");
  });
  list.appendChild(row);
 });
}
renderRods();

function openPanel(id){document.getElementById(id).style.display="flex"}
function closePanel(id){document.getElementById(id).style.display="none"}
document.getElementById("rodBtn").onclick=()=>{renderRods();openPanel("rodPanel")};
document.getElementById("closeRods").onclick=()=>closePanel("rodPanel");
document.getElementById("settingsBtn").onclick=()=>openPanel("settingsPanel");
document.getElementById("menuSettings").onclick=()=>openPanel("settingsPanel");
document.getElementById("closeSettings").onclick=()=>closePanel("settingsPanel");
document.getElementById("timeMode").onchange=e=>{
 const night=e.target.value==="night";
 scene.background.set(night?0x08172b:0x82c8e6);
 scene.fog.color.set(night?0x08172b:0x82c8e6);
 sun.intensity=night?.35:2.4;
 hemi.intensity=night?.45:2.2;
};
document.getElementById("playerColor").oninput=e=>player.bodyMat.color.set(e.target.value);

document.querySelectorAll(".panelShade").forEach(p=>p.addEventListener("click",e=>{if(e.target===p)p.style.display="none"}));

let playing=false;
function startGame(){
 playing=true; document.getElementById("menu").style.display="none"; document.getElementById("hud").hidden=false;
}
document.getElementById("playBtn").onclick=startGame;
document.getElementById("coopBtn").onclick=()=>toast("Co-op is planned for the multiplayer version.");

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let fishing=false;
function castAt(clientX,clientY){
 if(!playing||fishing) return;
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(spots.map(s=>s.ring),false);
 if(!hits.length){message("Please tap a raised fishing spot to cast.");return;}
 beginFishing();
}
renderer.domElement.addEventListener("pointerdown",e=>{if(!e.isPrimary)return;castAt(e.clientX,e.clientY)});

let miniFrame=0, miniDir=1, miniStart=0, difficulty="Easy";
function chooseDifficulty(){
 const r=Math.random()*100;
 return r<70?"Easy":r<97?"Medium":"Hard";
}
function chooseRarity(){
 const odds=rods[currentRod].odds, r=Math.random()*100;
 return r<odds[0]?"Normal":r<odds[0]+odds[1]?"Rare":"Legendary";
}
function chooseFish(rarity){
 const arr=fish.filter(x=>x[1]===rarity);
 return arr[Math.floor(Math.random()*arr.length)];
}
function beginFishing(){
 fishing=true;
 difficulty=chooseDifficulty();
 const mini=document.getElementById("mini"); mini.style.display="flex";
 document.getElementById("waitText").textContent="Balık bekleniyor...";
 miniStart=performance.now();
 setTimeout(()=>{
   if(!fishing)return;
   document.getElementById("waitText").textContent="Balık yaklaşıyor!";
   miniStart=performance.now();
   miniDir=1;
   document.getElementById("cursor").style.top="0px";
 }, 900 + Math.random()*900);
}
function endFishing(success){
 fishing=false; document.getElementById("mini").style.display="none";
 if(!success){toast("The fish got away!");return;}
 const rarity=chooseRarity(), f=chooseFish(rarity), value=fishPrices[rarity];
 money+=value; updateMoney();
 toast(`${f[0]} caught! +${format(value)} money`,2600);
}
document.getElementById("mini").addEventListener("pointerdown",e=>{
 if(e.target.closest(".track")||e.currentTarget===e.target){
   const cur=document.getElementById("cursor"), safe=document.querySelector(".safe");
   const c=cur.getBoundingClientRect(), s=safe.getBoundingClientRect();
   const ok=c.top>=s.top-5 && c.bottom<=s.bottom+5;
   endFishing(ok);
 }
});

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
let joyActive=false,joyX=0,joyY=0;
function joyMove(e){
 const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy; const m=46, d=Math.hypot(x,y);
 if(d>m){x=x/d*m;y=y/d*m}
 joyX=x/m; joyY=y/m;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(joyActive)joyMove(e)});
joy.addEventListener("pointerup",()=>{joyActive=false;joyX=joyY=0;stick.style.transform="translate(0,0)"});
joy.addEventListener("pointercancel",()=>{joyActive=false;joyX=joyY=0;stick.style.transform="translate(0,0)"});

function animate(t){
 requestAnimationFrame(animate);
 // water shimmer
 waterMat.color.offsetHSL(0,0,0); // keeps material stable
 spots.forEach((s,i)=>{s.ring.scale.setScalar(s.scale*(1+Math.sin(t*.0015+i)*.035));s.ring.material.opacity=.58+Math.sin(t*.002+i)*.12});
 if(playing){
   let dx=joyX, dz=joyY;
   if(keys["w"]||keys["arrowup"])dz-=1;
   if(keys["s"]||keys["arrowdown"])dz+=1;
   if(keys["a"]||keys["arrowleft"])dx-=1;
   if(keys["d"]||keys["arrowright"])dx+=1;
   const len=Math.hypot(dx,dz)||1;
   if(Math.abs(dx)+Math.abs(dz)>.05){
     const sp=.075; player.group.position.x+=dx/len*sp; player.group.position.z+=dz/len*sp;
     player.group.position.x=THREE.MathUtils.clamp(player.group.position.x,-7.5,7.5);
     player.group.position.z=THREE.MathUtils.clamp(player.group.position.z,-6.8,6.8);
     player.group.rotation.y=Math.atan2(dx,dz);
     player.group.position.y=0;
   }
   const target=new THREE.Vector3(player.group.position.x,1.8,player.group.position.z);
   const desired=new THREE.Vector3(player.group.position.x+12,14,player.group.position.z+15);
   camera.position.lerp(desired,.075); camera.lookAt(target);
 }
 if(fishing){
   const elapsed=t-miniStart;
   if(elapsed>1800){
     const speed=difficulty==="Easy"?.34:difficulty==="Medium"?.58:.82;
     let y=parseFloat(document.getElementById("cursor").style.top||"0");
     y+=miniDir*speed;
     const max=330;
     if(y>=max){y=max;miniDir=-1}
     if(y<=0){y=0;miniDir=1}
     document.getElementById("cursor").style.top=y+"px";
   }
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
