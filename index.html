  if(roomUnsub)roomUnsub();roomUnsub=onSnapshot(collection(db,"fishingRooms",code,"players"),snap=>{
   players.textContent=snap.size+" player"+(snap.size===1?"":"s")+" in room";
   snap.docChanges().forEach(ch=>{if(ch.doc.id===uid)return;let d=ch.doc.data(),o=scene.getObjectByName("other_"+ch.doc.id);if(!o){o=new THREE.Mesh(new THREE.SphereGeometry(.56,20,14),new THREE.MeshStandardMaterial({color:"#"+(d.color||"4f9cff")}));o.name="other_"+ch.doc.id;o.position.y=2.35;scene.add(o)}o.position.x=d.x||0;o.position.z=d.z||0});
  });
  roomStatus.textContent="Connected — share the code.";start();
clearInterval(window.fishingSyncTimer);
window.fishingSyncTimer=setInterval(async()=>{try{await setDoc(doc(db,"fishingRooms",code,"players",uid),{uid,x:playerGroup.position.x,z:playerGroup.position.z,color:playerMat.color.getHexString(),updatedAt:serverTimestamp()},{merge:true})}catch(e){}},250);
 }catch(e){console.error(e);roomStatus.textContent="Room connection was rejected by Firebase rules."}
}
publicRoom.onclick=()=>joinRoomCode("PUBLIC");privateRoom.onclick=()=>joinRoomCode(Math.random().toString(36).slice(2,8));joinRoomBtn.onclick=()=>joinRoomCode(roomInput.value);
coopMenu.onclick=()=>openPanel("coopPanel");coopHud.onclick=()=>openPanel("coopPanel");closeCoop.onclick=()=>closePanel("coopPanel");

function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,(t-last)/1000);last=t;
if(playing&&!fishing){
 let ix=jx,iz=jz;if(keys.w)iz--;if(keys.s)iz++;if(keys.a)ix--;if(keys.d)ix++;
 let l=Math.hypot(ix,iz)||1;
 if(Math.abs(ix)+Math.abs(iz)>.05){
  ix/=l;iz/=l;const fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  const move=new THREE.Vector3().addScaledVector(right,ix).addScaledVector(fwd,-iz).normalize();
  playerGroup.position.x=THREE.MathUtils.clamp(playerGroup.position.x+move.x*3.2*dt,-7.5,7.5);
  playerGroup.position.z=THREE.MathUtils.clamp(playerGroup.position.z+move.z*3.2*dt,-6.8,6.8);
 }
}
if(fishing){
 let speed=difficulty==="Easy"?22:difficulty==="Medium"?34:48;timingX+=timingDir*speed*dt;if(timingX>100){timingX=100;timingDir=-1}if(timingX<0){timingX=0;timingDir=1}timingMarker.style.left=timingX+"%";
 miniY+=dir*(difficulty==="Easy"?45:difficulty==="Medium"?80:115)*dt;if(miniY>270){miniY=270;dir=-1}if(miniY<35){miniY=35;dir=1}dot.style.top=miniY+"px"
}
controls.target.lerp(new THREE.Vector3(playerGroup.position.x,1.5,playerGroup.position.z),.08);controls.update();renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
