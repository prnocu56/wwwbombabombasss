function itemEmoji(name){if(name==="rod")return "🪝";const map={"Shrimp":"🦐","Anchovy":"🐟","Atlantic Silverside":"🐟","Bass":"🐟","Blue Crab":"🦀","Blue Mackerel":"🐟","Mullet":"🐟","Salmon":"🐟","Sardine":"🐟","Sea Bream":"🐟","Sole":"🐟","Starfish":"⭐","Tune":"🐟","Whiting":"🐟","Cod":"🐟","Krill":"🦐","Lobster":"🦞","Moon Jellyfish":"🪼","Parrotfish":"🐠","Purple Octopus":"🐙","Caretta Caretta":"🐢","Cauliflower Jellyfish":"🪼","Clownfish":"🐠","Eel":"🐍","Lionfish":"🐠","Mola Mola":"🐟","Seahorse":"🦐","Stingray":"🦈","Dragon Moray Eel":"🐉","Kraken":"🐙","Great Whale":"🐋","Nautilus":"🐚","Whale Shark":"🦈","İsonade":"🌊"};return map[name]||"🐟"}
function renderHotbar(){const bar=$("hotbar");if(!bar)return;bar.innerHTML="";const rod=document.createElement("button");rod.className="slot"+(heldItem==="rod"?" selected":"");rod.innerHTML='<span class="key">1</span>🪝';rod.title="Equip rod";rod.onclick=()=>{heldItem="rod";updateHeldItem();renderHotbar();saveState()};bar.appendChild(rod);let entries=Object.entries(inventory).filter(([,v])=>v&&v.count>0).slice(0,7);entries.forEach(([name,v],idx)=>{const b=document.createElement("button");b.className="slot"+(heldItem===name?" selected":"");b.innerHTML='<span class="key">'+(idx+2)+'</span>'+itemEmoji(name)+'<span class="count">'+v.count+'</span>';b.title=name;b.onclick=()=>{heldItem=name;updateHeldItem();renderHotbar();saveState()};bar.appendChild(b)});}
function updateHeldItem(){heldGroup.visible=heldItem==="rod"||!!inventory[heldItem];if(heldItem==="rod"){heldRod.visible=true;heldFish.visible=false}else if(inventory[heldItem]){heldRod.visible=false;heldFish.visible=true;heldFish.material.color.set(heldItem.includes("Shrimp")?0xff8c5a:0x66b6e8)}else{heldRod.visible=true;heldFish.visible=false}}
loadLocal();renderRods();renderHotbar();

function openPanel(x){document.getElementById(x).style.display="flex"}function closePanel(x){document.getElementById(x).style.display="none"}
rodBtn.onclick=()=>{renderRods();openPanel("rodPanel")};closeRods.onclick=()=>closePanel("rodPanel");settingsMenu.onclick=()=>openPanel("settingsPanel");closeSettings.onclick=()=>closePanel("settingsPanel");
document.querySelectorAll(".shade").forEach(e=>e.addEventListener("pointerdown",x=>{if(x.target===e)e.target.style.display="none"}));
timeMode.onchange=e=>{let n=e.target.value==="night";scene.background.set(n?0x09182b:0x9ed1e3);scene.fog.color.set(n?0x09182b:0x9ed1e3);sun.intensity=n?.45:2.3;hemi.intensity=n?.55:2.2;saveState()};playerColor.oninput=e=>{playerMat.color.set(e.target.value);saveState()};
function start(){playing=true;menu.style.display="none";hud.hidden=false;controls.enabled=true;updateHeldItem();renderHotbar();}
play.onclick=start;

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown",e=>{if(!playing||fishing||e.target!==renderer.domElement)return;let r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);if(ray.intersectObject(crate,true).length){if(Object.values(inventory).some(v=>v&&v.count>0)){openPanel("sellPanel")}else toast("Your inventory is empty.");return}if(ray.intersectObjects(spots,true).length){if(heldItem!=="rod"){toast("Equip your rod first.");return}beginFishing();return}msg("Please tap a raised fishing spot to cast.")});
let miniY=40,dir=1,last=performance.now(),difficulty="Easy",waitTimer;
function beginFishing(){fishing=true;controls.enabled=false;difficulty=Math.random()<.70?"Easy":Math.random()<.90?"Medium":"Hard";mini.style.display="block";miniMsg.textContent=difficulty+" — Balık bekleniyor...";miniMsg.textContent="Balık bekleniyor...";clearTimeout(waitTimer);waitTimer=setTimeout(()=>{if(fishing)miniMsg.textContent="Balık yaklaşıyor!"},900)}
function finish(ok){fishing=false;mini.style.display="none";controls.enabled=true;castLine.visible=false;if(!ok){toast("The fish got away!");return}let o=currentRod===0?[70,27,3]:rods[currentRod-1][2],r=Math.random()*100,rar=r<o[0]?"Normal":r<o[0]+o[1]?"Rare":"Legendary",a=fish.filter(x=>x[1]===rar),f=a[Math.floor(Math.random()*a.length)],v=val[rar];if(!inventory[f[0]])inventory[f[0]]={rarity:rar,value:v,count:0};inventory[f[0]].count++;heldItem="rod";updateHeldItem();renderHotbar();saveState();toast(f[0]+" caught! Added to inventory.")}
function tryCatch(){if(!fishing)return;let a=target.getBoundingClientRect(),b=dot.getBoundingClientRect(),cy=b.top+b.height/2;finish(cy>=a.top&&cy<=a.bottom)}
$("miniTap").onclick=tryCatch;mini.addEventListener("pointerdown",e=>{if(e.target===mini)tryCatch()});

const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let jx=0,jz=0,active=false;function joyMove(e){let r=joystick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),z=e.clientY-(r.top+r.height/2),d=Math.hypot(x,z),m=45;if(d>m){x=x/d*m;z=z/d*m}jx=-x/m;jz=z/m;stick.style.transform=`translate(${x}px,${z}px)`}
joystick.addEventListener("pointerdown",e=>{active=true;joystick.setPointerCapture(e.pointerId);joyMove(e)});joystick.addEventListener("pointermove",e=>active&&joyMove(e));joystick.addEventListener("pointerup",()=>{active=false;jx=jz=0;stick.style.transform="translate(0,0)"});

async function joinRoomCode(code){
 if(!db){roomStatus.textContent="Firebase connection unavailable.";return}
 code=code.trim().toUpperCase();if(!code)return;
 roomCode.textContent=code;roomCode.hidden=false;roomStatus.textContent="Connecting...";
 try{
  await setDoc(doc(db,"fishingRooms",code,"players",uid),{uid,x:playerGroup.position.x,z:playerGroup.position.z,color:playerMat.color.getHexString(),updatedAt:serverTimestamp()},{merge:true});
  if(roomUnsub)roomUnsub();roomUnsub=onSnapshot(collection(db,"fishingRooms",code,"players"),snap=>{
   players.textContent=snap.size+" player"+(snap.size===1?"":"s")+" in room";
   snap.docChanges().forEach(ch=>{if(ch.doc.id===uid)return;let d=ch.doc.data(),o=scene.getObjectByName("other_"+ch.doc.id);if(!o){o=new THREE.Mesh(new THREE.SphereGeometry(.56,20,14),new THREE.MeshStandardMaterial({color:"#"+(d.color||"4f9cff")}));o.name="other_"+ch.doc.id;o.position.y=2.35;scene.add(o)}o.position.x=d.x||0;o.position.z=d.z||0});
  });
  roomStatus.textContent="Connected — share the code.";start();
 }catch(e){console.error(e);roomStatus.textContent="Room connection was rejected by Firebase rules."}
}
$("confirmSell").onclick=()=>{let total=0,count=0;Object.values(inventory).forEach(v=>{count+=v.count;total+=v.value*v.count;v.count=0});money+=total;updateMoney();heldItem="rod";updateHeldItem();renderHotbar();saveState();closePanel("sellPanel");toast(`${count} fish sold for ${fmt(total)} money!`)};
$("cancelSell").onclick=()=>closePanel("sellPanel");
publicRoom.onclick=()=>joinRoomCode("PUBLIC-"+location.hostname.replace(/[^a-z0-9]/gi,"").slice(0,7).toUpperCase());privateRoom.onclick=()=>joinRoomCode(Math.random().toString(36).slice(2,8));joinRoomBtn.onclick=()=>joinRoomCode(roomInput.value);
coopMenu.onclick=()=>openPanel("coopPanel");closeCoop.onclick=()=>closePanel("coopPanel");

function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,(t-last)/1000);last=t;
if(playing&&!fishing){let x=jx,z=jz;if(keys.a)x--;if(keys.d)x++;if(keys.w)z--;if(keys.s)z++;let l=Math.hypot(x,z)||1;if(Math.abs(x)+Math.abs(z)>.05){playerGroup.position.x=THREE.MathUtils.clamp(playerGroup.position.x+x/l*3.2*dt,-7.8,7.8);playerGroup.position.z=THREE.MathUtils.clamp(playerGroup.position.z+z/l*3.2*dt,-7.2,7.2)}}
if(fishing){let speed=difficulty==="Easy"?70:difficulty==="Medium"?120:175;miniY+=dir*speed*dt;if(miniY>270){miniY=270;dir=-1}if(miniY<35){miniY=35;dir=1}dot.style.top=miniY+"px";const spot=spots[0];if(spot){const p=spot.position;const pts=[new THREE.Vector3(.35,1.9,.1),new THREE.Vector3(p.x,p.y+1.0,p.z)];castLine.geometry.setFromPoints(pts);castLine.visible=true}}
controls.target.lerp(new THREE.Vector3(playerGroup.position.x,1.5,playerGroup.position.z),.08);controls.update();renderer.render(scene,camera)}
addEventListener("visibilitychange",()=>{if(document.hidden)saveState()});addEventListener("beforeunload",()=>saveState());requestAnimationFrame(animate);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
